<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>رفع وتحليل الكتب</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700&display=swap');
        body { font-family: 'Tajawal', sans-serif; }
        .loader {
            border: 8px solid #f3f3f3;
            border-radius: 50%;
            border-top: 8px solid #3498db;
            width: 60px;
            height: 60px;
            animation: spin 2s linear infinite;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body class="bg-gray-100">
    <div class="container mx-auto p-8">
        <header class="text-center mb-8">
            <h1 class="text-4xl font-bold text-gray-800">خدمة استيعاب المحتوى 📚</h1>
            <p class="text-gray-600 mt-2">ارفع كتابًا بصيغة PDF ليتم تفكيكه وتحليله</p>
        </header>
        <div class="bg-white p-8 rounded-lg shadow-md max-w-2xl mx-auto">
            <div class="mb-6">
                <label for="pdfFile" class="block mb-2 text-lg font-bold text-gray-700">اختر ملف الكتاب:</label>
                <input type="file" id="pdfFile" accept=".pdf" class="block w-full text-sm text-gray-500 file:mr-4 file:py-2 file:px-4 file:rounded-full file:border-0 file:text-sm file:font-semibold file:bg-blue-50 file:text-blue-700 hover:file:bg-blue-100"/>
            </div>
            <button onclick="uploadAndProcess()" id="uploadBtn" class="w-full bg-blue-600 text-white font-bold py-3 px-4 rounded-md hover:bg-blue-700 transition duration-300">
                تحليل الكتاب
            </button>
        </div>
        <div id="status" class="text-center mt-8"></div>
        <div id="results-container" class="mt-8 bg-white p-6 rounded-lg shadow-md hidden">
            <h2 class="text-2xl font-bold text-gray-700 mb-4">النتائج (JSON)</h2>
            <pre id="results" class="p-4 bg-gray-50 rounded-md text-sm overflow-auto max-h-96"></pre>
        </div>
    </div>
    <script>
        const API_BASE_URL = "http://127.0.0.1:8000";
        async function uploadAndProcess() {
            const fileInput = document.getElementById('pdfFile');
            const statusDiv = document.getElementById('status');
            const resultsContainer = document.getElementById('results-container');
            const resultsPre = document.getElementById('results');
            const uploadBtn = document.getElementById('uploadBtn');
            if (fileInput.files.length === 0) {
                alert("الرجاء اختيار ملف PDF أولاً.");
                return;
            }
            const file = fileInput.files[0];
            const formData = new FormData();
            formData.append("file", file);
            statusDiv.innerHTML = '<div class="loader mx-auto"></div><p class="mt-4 text-lg">جاري معالجة الكتاب... هذه العملية قد تستغرق عدة دقائق. الرجاء الانتظار.</p>';
            resultsContainer.classList.add('hidden');
            uploadBtn.disabled = true;
            try {
                const response = await fetch(`${API_BASE_URL}/process-pdf/`, {
                    method: 'POST',
                    body: formData,
                });
                if (!response.ok) {
                    const errorData = await response.json();
                    throw new Error(errorData.detail || `حدث خطأ: ${response.statusText}`);
                }
                const data = await response.json();
                statusDiv.innerHTML = `<p class="text-2xl text-green-600 font-bold">✅ ${data.message}</p>`;
                resultsPre.textContent = JSON.stringify(data.content, null, 2);
                resultsContainer.classList.remove('hidden');
            } catch (error) {
                statusDiv.innerHTML = `<p class="text-2xl text-red-600 font-bold">❌ فشلت العملية: ${error.message}</p>`;
            } finally {
                uploadBtn.disabled = false;
            }
        }
    </script>
</body>
</html>
